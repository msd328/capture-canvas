[package]
name = "recorder"
version = "0.1.0"
edition = "2021"
description = "Recorder — desktop screen recording (Phase 1)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
anyhow = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Capture",
    "Media_Capture_Frames",
    "Media_Devices",
    "Media_Editing",
    "Media_MediaProperties",
    "Media_Transcoding",
    "Storage",
    "Storage_FileProperties",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# windows-capture 2.0 uses windows 0.62.2 internally. Keep an explicit alias to
# that exact package for D3D11 resource types that cross the windows-capture
# Frame boundary; the app's existing Win32 enumeration code can remain on 0.61.
windows_capture_windows = { package = "windows", version = "0.62.2", features = [
    "Win32_Graphics_Direct3D11",
] }
# CPAL uses WASAPI on Windows. We capture microphone/render streams natively and
# feed PCM into the Windows encoder/mixer.
cpal = "0.15"
hound = "3.5"
# MIT-licensed wrapper over Windows.Graphics.Capture + D3D11. The dependency is
# aliased so our crate-local `windows_capture` facade can add encoder diagnostics
# while preserving the existing capture API paths.
windows_capture_core = { package = "windows-capture", version = "2.0" }
