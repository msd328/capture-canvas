[package]
name = "recorder"
version = "0.1.0"
edition = "2021"
description = "Recorder — desktop screen recording (Phase 1)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
anyhow = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Media_Devices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
# CPAL uses WASAPI on Windows. We capture the default render endpoint through
# its loopback-capable input stream and write a temporary PCM track per segment.
cpal = "0.15"
hound = "3.5"
# MIT-licensed wrapper over Windows.Graphics.Capture + D3D11. It gives us real
# HWND/HMONITOR capture, fixing the gdigrab white-window problem while keeping
# our own recorder orchestration/encoding pipeline closed-source compatible.
windows-capture = "2.0"
