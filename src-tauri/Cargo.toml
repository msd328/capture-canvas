[package]
name = "recorder"
version = "0.1.0"
edition = "2021"
description = "Recorder — desktop screen recording (Phase 1)"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
anyhow = "1"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Graphics_Imaging",
    "Media_Capture",
    "Media_Capture_Frames",
    "Media_Devices",
    "Media_Editing",
    "Media_MediaProperties",
    "Media_Transcoding",
    "Storage",
    "Storage_FileProperties",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Credentials",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# windows 0.61 projects WinRT async support through its matching companion crate.
# Keep this direct dependency so the bounded finalizer can name AsyncStatus without
# relying on a transitive dependency or a version-mismatched generated namespace.
windows-future = "0.2"
# windows-capture 2.0 uses windows 0.62.2 internally. Keep an explicit alias to
# that exact package for D3D11 resource types that cross the windows-capture
# Frame boundary; the app's existing Win32 enumeration code can remain on 0.61.
windows_capture_windows = { package = "windows", version = "0.62.2", features = [
    "Win32_Graphics_Direct3D11",
] }
# CPAL uses WASAPI on Windows. We capture microphone/render streams natively and
# feed PCM into the Windows encoder/mixer.
cpal = "0.15"
hound = "3.5"
# Final local facade layering:
# recorder -> static-tail continuity -> health diagnostics -> MIT windows-capture 2.0.
# The dependency remains a real external crate named `windows_capture`, avoiding
# collision with this application's root `capture` module.
windows_capture = { package = "windows-capture-continuity", path = "windows-capture-continuity" }
