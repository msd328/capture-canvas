[package]
name = "recorder"
version = "0.1.0"
edition = "2021"
description = "Recorder — desktop screen recording (Phase 1)"

# Lovable generated a binary-only Tauri scaffold with src/main.rs.
# Keep this as a binary crate for now; a separate library target is unnecessary.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
parking_lot = "0.12"
anyhow = "1"

# Windows-native capture/device APIs. We use public Windows APIs directly
# rather than importing Cap's AGPL application/orchestration code.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Media_Devices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# TODO(native): enable these only when their corresponding capture pipeline is added.
# cpal = "0.15"
# ffmpeg-next = "7"
